name: AI and automation newsletter

on:
  schedule:
    - cron: "0 13 * * 1"
    - cron: "15 13 1 * *"
  workflow_dispatch:
    inputs:
      period:
        description: Digest period
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - monthly
      test_recipients:
        description: Comma-separated addresses for a test preview only
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ai-newsletter
  cancel-in-progress: false

jobs:
  send-digest:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_recipients == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine digest period
        id: period
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PERIOD: ${{ inputs.period }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=$INPUT_PERIOD" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "15 13 1 * *" ]; then
            echo "value=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "value=weekly" >> "$GITHUB_OUTPUT"
          fi

      - name: Run newsletter checks
        run: python -m unittest discover -s tests -p "test_ai_newsletter.py" -v

      - name: Check email delivery configuration
        id: email-config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || \
             [ -z "$RESEND_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Newsletter not sent: configure the Supabase and email-provider secrets described in SETUP.md."
          else
            subscribers=$(curl --fail --silent --show-error --get \
              "$SUPABASE_URL/rest/v1/newsletter_subscribers" \
              --data-urlencode "select=email,unsubscribe_token" \
              --data-urlencode "is_active=eq.true" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
            if ! echo "$subscribers" | jq -e 'type == "array"' > /dev/null; then
              echo "::error::Could not read the newsletter subscriber list from Supabase."
              exit 1
            fi
            if ! echo "$subscribers" | jq -e 'length > 0' > /dev/null; then
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Newsletter not sent: there are no active subscribers."
            else
              newsletter_subscribers=$(echo "$subscribers" | jq -c '[.[] | {email, token: .unsubscribe_token}]')
              while IFS= read -r value; do
                [ -z "$value" ] || echo "::add-mask::$value"
              done < <(echo "$subscribers" | jq -r '.[] | .email, .unsubscribe_token')
              echo "::add-mask::$newsletter_subscribers"
              printf 'NEWSLETTER_SUBSCRIBERS=%s\n' "$newsletter_subscribers" >> "$GITHUB_ENV"
              echo "configured=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Send digest
        if: steps.email-config.outputs.configured == 'true'
        env:
          DIGEST_PERIOD: ${{ steps.period.outputs.value }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          NEWSLETTER_SIGNUP_URL: ${{ vars.NEWSLETTER_SIGNUP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/ai_newsletter.py --period "$DIGEST_PERIOD"

  send-test-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_recipients != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run newsletter checks
        run: python -m unittest discover -s tests -p "test_ai_newsletter.py" -v

      - name: Send test preview to requested recipients only
        env:
          DIGEST_PERIOD: ${{ inputs.period }}
          TEST_RECIPIENTS: ${{ inputs.test_recipients }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          NEWSLETTER_SIGNUP_URL: ${{ vars.NEWSLETTER_SIGNUP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWS_SMTP_HOST: ${{ secrets.NEWS_SMTP_HOST }}
          NEWS_SMTP_PORT: ${{ secrets.NEWS_SMTP_PORT }}
          NEWS_SMTP_USERNAME: ${{ secrets.NEWS_SMTP_USERNAME }}
          NEWS_SMTP_PASSWORD: ${{ secrets.NEWS_SMTP_PASSWORD }}
        run: python scripts/ai_newsletter.py --period "$DIGEST_PERIOD" --test-recipient "$TEST_RECIPIENTS"
