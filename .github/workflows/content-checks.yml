name: Content and certificate checks

on:
  pull_request:
    paths:
      - "content/**"
      - "index.html"
      - "app.js"
      - "scripts/**"
      - "tests/test_completion_emails.py"
      - ".github/workflows/content-checks.yml"
      - ".github/workflows/completion-emails.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate course content
        run: node scripts/validate_content.js
      - name: Check app script syntax
        run: node --check app.js
      - name: Test completion emails
        run: python -m unittest discover -s tests -p "test_completion_emails.py" -v
